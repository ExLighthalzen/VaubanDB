name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without publishing the image or the Release
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      stable: ${{ steps.meta.outputs.stable }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      publish: ${{ steps.meta.outputs.publish }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version, tag and destination
        id: meta
        run: |
          set -euo pipefail
          cargo_version=$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'])")

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            tag_version="${tag#v}"
            tag_core="${tag_version%%-*}"
            if [ "${tag_core}" != "${cargo_version}" ]; then
              echo "Tag ${tag} (core ${tag_core}) does not match workspace.package.version=${cargo_version}" >&2
              exit 1
            fi
            is_tag=true
          else
            tag="v${cargo_version}"
            is_tag=false
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            dry_run=true
          else
            dry_run=false
          fi

          if [ "${dry_run}" = "false" ] && [ "${is_tag}" = "true" ]; then
            publish=true
          else
            publish=false
          fi

          if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            stable=true
          else
            stable=false
          fi

          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/vaubandb"

          echo "version=${cargo_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "stable=${stable}" >> "${GITHUB_OUTPUT}"
          echo "dry_run=${dry_run}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag} version=${cargo_version} stable=${stable} dry_run=${dry_run} publish=${publish} image=${image}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            docker_arch: amd64
            test: true
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            docker_arch: arm64
            test: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.rust_target }}
      - name: Tests (amd64)
        if: matrix.test
        run: cargo test --workspace
      # The binary is built inside the rust:*-bookworm image rather than on the runner:
      # ubuntu-latest ships a newer glibc than debian:bookworm-slim, and the C code of
      # aws-lc-sys (rustls) linked on the runner needs symbols the runtime image lacks.
      - name: Release binary (Debian bookworm glibc)
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.cargo/registry"
          docker run --rm -i \
            -v "${PWD}:/src" -w /src \
            -v "${HOME}/.cargo/registry:/usr/local/cargo/registry" \
            -e CARGO_TERM_COLOR -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            rust:1.98.1-slim-bookworm sh -eu <<'EOF'
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cmake binutils >/dev/null
          cargo build --release -p vauban-cli
          strip -s target/release/vauban
          chown -R "${HOST_UID}:${HOST_GID}" target /usr/local/cargo/registry
          EOF
          ./target/release/vauban version
          echo "glibc required: $(objdump -T target/release/vauban | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
      - name: Archive tar.gz
        run: |
          set -euo pipefail
          name="vauban-${{ needs.prepare.outputs.tag }}-${{ matrix.rust_target }}"
          mkdir -p "dist/${name}"
          cp target/release/vauban "dist/${name}/vauban"
          cp LICENSE "dist/${name}/LICENSE"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          mkdir -p artifacts
          mv "${name}.tar.gz" artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: vauban-${{ matrix.rust_target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
      - name: Prepare the Docker context
        run: |
          mkdir -p dist
          cp target/release/vauban dist/vauban
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          load: true
          provenance: false
          sbom: false
          platforms: linux/${{ matrix.docker_arch }}
          tags: vauban:ci
          build-args: |
            VAUBAN_VERSION=${{ needs.prepare.outputs.version }}
            VAUBAN_REVISION=${{ github.sha }}
      - name: Check the image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint vauban vauban:ci version
          set +e
          docker run --rm vauban:ci
          status=$?
          set -e
          if [ "${status}" -ne 2 ]; then
            echo "without a password the container must exit with code 2 (got ${status})" >&2
            exit 1
          fi
      - name: Push the per-architecture image
        if: needs.prepare.outputs.publish == 'true'
        run: |
          set -euo pipefail
          dest="${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.docker_arch }}"
          docker tag vauban:ci "${dest}"
          docker push "${dest}"

  # Separate from `build`: no container image is produced for Windows, and the runner
  # builds natively rather than inside rust:*-bookworm.
  build-windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # aws-lc-sys (rustls) assembles its primitives with NASM, which the Windows runner
      # image does not ship. The crate carries prebuilt objects for x86_64.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-pc-windows-msvc
      - name: Release binary
        run: cargo build --release -p vauban-cli --target x86_64-pc-windows-msvc
      - name: Check the binary
        run: .\target\x86_64-pc-windows-msvc\release\vauban.exe version
      - name: Archive zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "vauban-${{ needs.prepare.outputs.tag }}-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "dist/$name", artifacts | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/vauban.exe" "dist/$name/vauban.exe"
          Copy-Item LICENSE "dist/$name/LICENSE"
          Compress-Archive -Path "dist/$name" -DestinationPath "artifacts/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: vauban-x86_64-pc-windows-msvc
          path: artifacts/*.zip
          if-no-files-found: error

  publish:
    needs: [prepare, build, build-windows]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Archives only: the *.dockerbuild artifacts of build-push-action made the download
      # fail "after 5 attempts" in the v0.0.2 run.
      - uses: actions/download-artifact@v4
        with:
          pattern: vauban-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum vauban-*.tar.gz vauban-*.zip | tee SHA256SUMS
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch manifest
        run: |
          set -euo pipefail
          image="${{ needs.prepare.outputs.image }}"
          tag="${{ needs.prepare.outputs.tag }}"
          docker buildx imagetools create \
            -t "${image}:${tag}" \
            "${image}:${tag}-amd64" \
            "${image}:${tag}-arm64"
          if [ "${{ needs.prepare.outputs.stable }}" = "true" ]; then
            docker buildx imagetools create \
              -t "${image}:latest" \
              "${image}:${tag}-amd64" \
              "${image}:${tag}-arm64"
          fi
          docker buildx imagetools inspect "${image}:${tag}"
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/vauban-*.tar.gz
            artifacts/vauban-*.zip
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.stable != 'true' }}
          body: |
            Archives: `.tar.gz` for `linux/amd64` and `linux/arm64`, `.zip` holding `vauban.exe` for `windows/x86_64`.

            GHCR images (`linux/amd64`, `linux/arm64`):

            ```
            docker pull ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}
            docker run --rm -e VAUBAN_SA_PASSWORD='ChangeMe123!' -p 1433:1433 \
              ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}
            ```

            The engine only has in-memory storage for now: databases do not survive a container restart.
