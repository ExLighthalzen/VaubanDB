[package]
name = "vauban-storage"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# The generic contract suite of the `Storage` trait (`testsuite` module).
# Off by default: only test targets of this crate and of the on-disk implementation need it.
testsuite = []

[dependencies]
vauban-errors.workspace = true
vauban-types.workspace = true

[dev-dependencies]
# Self-dependency so that the integration tests (`tests/`) see the `testsuite` module.
vauban-storage = { path = ".", features = ["testsuite"] }

[lints]
workspace = true
