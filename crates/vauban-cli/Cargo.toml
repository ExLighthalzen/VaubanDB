[package]
name = "vauban-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
clap.workspace = true
serde.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
vauban-session.workspace = true
vauban-storage.workspace = true
# The binary fills the process-wide `sysfn` registry before it listens.
vauban-sysfn.workspace = true
vauban-compat.workspace = true
# `SaPasswordAuthenticator` and `NoAuth` return `SqlResult`.
vauban-errors.workspace = true

[dev-dependencies]
