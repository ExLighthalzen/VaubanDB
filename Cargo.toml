[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.5"
edition = "2024"
publish = false
license = "BSD-3-Clause"
repository = "https://github.com/ExLighthalzen/VaubanDB"
homepage = "https://github.com/ExLighthalzen/VaubanDB"
rust-version = "1.98.1"

[workspace.dependencies]
# Internal crates. Crates consume them with `vauban-<module>.workspace = true`,
# never with a relative `path`.
vauban-errors = { path = "crates/vauban-errors" }
vauban-types = { path = "crates/vauban-types" }
vauban-tds = { path = "crates/vauban-tds" }
vauban-parser = { path = "crates/vauban-parser" }
vauban-sysfn = { path = "crates/vauban-sysfn" }
vauban-storage = { path = "crates/vauban-storage" }
vauban-txn = { path = "crates/vauban-txn" }
vauban-catalog = { path = "crates/vauban-catalog" }
vauban-binder = { path = "crates/vauban-binder" }
vauban-planner = { path = "crates/vauban-planner" }
vauban-executor = { path = "crates/vauban-executor" }
vauban-session = { path = "crates/vauban-session" }
vauban-compat = { path = "crates/vauban-compat" }
vauban-cli = { path = "crates/vauban-cli" }

# External crates: the allow-list. Adding or removing an entry is a decision, not a
# code change.
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec", "compat", "rt"] }
bytes = "1.12.1"
futures-util = "0.3.34"
rustls = "0.23.44"
tokio-rustls = "0.26.5"
rustls-pemfile = "2.2.0"
rcgen = "0.14.10"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
regex = "1.13.1"
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
